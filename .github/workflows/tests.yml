# Reusable: run every flake check in its own job (each job only builds its own VM
# image, which keeps it within the runner's disk and runs the tests in parallel).
name: Tests

on:
  workflow_call:
    inputs:
      lock-artifact:
        description: Artifact holding a flake.lock to test instead of the committed one
        type: string
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.lock-artifact != ''
        with:
          name: ${{ inputs.lock-artifact }}
      - uses: cachix/install-nix-action@v31
      - id: list
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.lock-artifact != ''
        with:
          name: ${{ inputs.lock-artifact }}

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: ${{ matrix.check }}
        run: nix build -L ".#checks.x86_64-linux.${{ matrix.check }}"
